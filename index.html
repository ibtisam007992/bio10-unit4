<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>كتاب حي · التكاثر في الإنسان · الأحياء الصف العاشر</title>
<style>
@font-face{font-family:"CodeLatin";src:local("Cascadia Mono"),local("Consolas"),local("Menlo-Regular"),local("SF Mono"),local("DejaVu Sans Mono"),local("Courier New");unicode-range:U+0000-02FF,U+2000-206F,U+2190-2BFF;}
:root{
  --c-egg:#c93d72; --c-sperm:#0f8796; --c-zyg:#7a4bc6; --c-lin:#c35a35; --c-ox:#d23b2f; --c-deox:#2f5fd0;
  --c-food:#2e9a57; --c-co2:#6b7280; --c-urea:#b88c00; --c-tox:#222; --c-hiv:#c97f00; --c-wbc:#4c6ea8;
  --paper:#fbf6ea; --paper2:#f2e8d2; --ink:#2b2622; --muted:#6b6257; --note:#fff0a0; --noteInk:#4f4200;
  --pencil:#3b3834; --accent:#c2410c; --good:#1e8a4c; --soft:#d9822b; --tint:#f4dccd; --tint2:#efe2c9;
  --ui:#fffaf0ee; --uiInk:#2b2622; --navH:64px;
  --fa:"Cairo","Noto Sans Arabic","Noto Naskh Arabic","Segoe UI","Tahoma","Geeza Pro","DejaVu Sans",sans-serif;
  --fe:"Cairo","Segoe UI","Helvetica Neue","Arial","DejaVu Sans",sans-serif;
  --fm:"CodeLatin","Cairo","Noto Sans Arabic","Segoe UI","Tahoma",monospace;
}
body.dark{
  --paper:#2b2721; --paper2:#221f1a; --ink:#efe6d8; --muted:#b6aa97; --note:#5a5020; --noteInk:#fff2a8;
  --pencil:#d9d0c1; --accent:#ff8a4c; --good:#4fd08a; --soft:#f0a14c; --tint:#4a3a33; --tint2:#3d362c; --ui:#2c2722ee; --uiInk:#f2e9db;
  --c-egg:#f07aa6; --c-sperm:#3fc9d6; --c-zyg:#b28cf0; --c-lin:#ef8a62; --c-ox:#ff6b5e; --c-deox:#6e96ff; --c-food:#5fd08a; --c-co2:#a3a9b4; --c-urea:#f0c84c; --c-tox:#eee; --c-hiv:#f0b44c; --c-wbc:#8fb0ea;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#d8b88a}
body{font-family:var(--fa);color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none}
body[data-lang=en]{font-family:var(--fe)}
button{font:inherit;color:inherit;cursor:pointer}
.ok{color:var(--good);font-weight:800}.bad{color:var(--c-ox);font-weight:800}
.mono{font-family:var(--fm)}
.k-egg{color:var(--c-egg)}.k-sperm{color:var(--c-sperm)}.k-zyg{color:var(--c-zyg)}.k-lin{color:var(--c-lin)}.k-ox{color:var(--c-ox)}.k-hiv{color:var(--c-hiv)}.k-wbc{color:var(--c-wbc)}.k-food{color:var(--c-food)}

/* desk */
.desk{position:fixed;inset:0;width:100%;height:100%;z-index:0}
body.dark .desk{filter:brightness(.42) saturate(.85)}
.light{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(120% 90% at 12% -10%,rgba(255,250,232,.55),rgba(255,250,232,0) 55%),radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(45,28,10,.38) 100%)}
body.dark .light{background:radial-gradient(120% 90% at 12% -10%,rgba(255,235,200,.10),rgba(0,0,0,0) 55%),radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 50%,rgba(0,0,0,.55) 100%)}

/* book */
#viewport{position:fixed;left:0;right:0;top:0;bottom:var(--navH);z-index:2;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
#stage{position:relative;flex:none;transform-origin:50% 50%}
#scene{position:absolute;inset:0;perspective:2600px;perspective-origin:50% 25%}
#book{position:absolute;left:50%;top:50%;height:var(--ph,860px);transform-style:preserve-3d}
.cover{position:absolute;left:-20px;right:-20px;top:-16px;bottom:-18px;border-radius:14px;transform:translateZ(-18px);
  background:radial-gradient(120% 80% at 30% 20%,#2f6b4f,#1d4634 70%),#245a40;
  box-shadow:0 30px 60px rgba(40,20,5,.55),0 8px 18px rgba(40,20,5,.4),inset 0 0 0 3px rgba(0,0,0,.25),inset 0 0 0 7px rgba(220,255,230,.10)}
.cover::after{content:"";position:absolute;inset:9px;border-radius:9px;border:1.5px dashed rgba(220,255,230,.25)}
.block{position:absolute;top:0;height:var(--ph,860px);transform:translateZ(-9px);background:#efe4cb;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
body.dark .block{background:#3a342b}
.thick{position:absolute;left:0;right:0;bottom:0;height:16px;transform-origin:50% 0;transform:translateY(var(--ph,860px)) rotateX(-90deg);
  background:repeating-linear-gradient(0deg,#e9dcc0 0 1px,#fbf4e3 1px 3px);box-shadow:inset 0 -3px 4px rgba(0,0,0,.15)}
body.dark .thick{background:repeating-linear-gradient(0deg,#4a4237 0 1px,#5a5144 1px 3px)}
.page{position:absolute;top:0;width:480px;height:var(--ph,860px);transform-style:preserve-3d;background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(0,0,0,0) 30%),var(--paper)}
.page.hide{display:none}
.page .gut{position:absolute;top:0;bottom:0;width:46px;pointer-events:none}
.page.sL .gut{right:0;background:linear-gradient(to left,rgba(60,40,20,.20),rgba(60,40,20,0))}
.page.sR .gut{left:0;background:linear-gradient(to right,rgba(60,40,20,.20),rgba(60,40,20,0))}
#flipLayer{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none;transform:translateZ(1px)}
.sheet{position:absolute;top:0;height:var(--ph,860px);width:0;transform-style:preserve-3d}
.strip{position:absolute;top:0;height:var(--ph,860px);transform-style:preserve-3d}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper)}
.face.back{transform:rotateY(180deg)}
.faceIn{position:absolute;top:0;background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(0,0,0,0) 30%),var(--paper)}
.fshade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(40,25,10,.35),rgba(40,25,10,.08));opacity:0}
.cast{position:absolute;top:0;height:var(--ph,860px);opacity:0}
#offscreen{position:fixed;left:-6000px;top:0;visibility:hidden}

/* text page */
.pin{position:absolute;inset:0;padding:32px 40px 30px;transform-style:preserve-3d}
.foot{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:11.5px;color:var(--muted);pointer-events:none}
.text{font-size:14.5px;line-height:1.5}
.text p{margin:0 0 7px}
.kicker{font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.3px}
.ttl{font-size:24px;line-height:1.2;margin:2px 0 6px}
.hook{font-size:15px;font-weight:600;color:var(--muted);border-inline-start:4px solid var(--accent);padding-inline-start:10px;margin:0 0 10px!important}
.law{margin:9px 0 8px;padding:7px 12px;border:2px solid var(--pencil);border-radius:12px;background:var(--paper2);text-align:center;font-size:14.5px;line-height:1.75}
.law b{font-size:15px}
.note{display:block;width:90%;margin:10px 0 8px;margin-inline-start:auto;padding:8px 13px;background:var(--note);color:var(--noteInk);font-size:14px;line-height:1.5;transform:rotate(-1.3deg);box-shadow:0 6px 10px rgba(80,60,0,.18);border-radius:2px 2px 10px 2px}
.note::before{content:"";display:block;width:56px;height:12px;margin:-15px auto 4px;background:rgba(255,255,255,.55);transform:rotate(2deg)}
.predict{transform-style:preserve-3d;margin:5px 0 9px}
.pq{font-size:14.5px;margin-bottom:5px}
.flapwrap{position:relative;transform-style:preserve-3d;min-height:50px}
.pa{padding:7px 12px;border-radius:10px;background:rgba(30,138,76,.10);border:1.5px solid var(--good);font-size:14px;line-height:1.5}
.flap{position:absolute;inset:0;border:2px dashed var(--pencil);border-radius:10px;background:var(--paper2);font-weight:800;font-size:15px;
  transform-origin:50% 0;transform:translateZ(1px);transition:transform .8s cubic-bezier(.3,1.4,.5,1);box-shadow:0 3px 8px rgba(0,0,0,.12)}
.flap.open{transform:translateZ(1px) rotateX(72deg);box-shadow:none}
body.nomotion .flap{transition:none}
.check{margin-top:4px;padding:8px 12px;border-radius:12px;border:2px solid var(--c-zyg)}
.cq{font-size:14.5px;margin-bottom:6px}
.opts{display:flex;gap:7px;flex-wrap:wrap}
.opt{min-height:38px;padding:4px 10px;border-radius:10px;border:2px solid var(--pencil);background:var(--paper);font-size:14.5px}
.opt.right{border-color:var(--good);background:rgba(30,138,76,.15)}
.opt.wrong{border-color:var(--soft);background:rgba(217,130,43,.13)}
.opt.pick{border-color:var(--c-zyg);background:rgba(122,75,198,.16)}
.cfb{min-height:20px;font-size:13.5px;margin-top:5px}

/* lab */
.lab{font-size:14.5px}
.labhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.labhead h2{font-size:21px;margin:0}
.hint{font-size:13px;color:var(--muted);margin:2px 0 4px}
.tbtn{border:1.5px solid var(--pencil);background:var(--paper2);border-radius:20px;padding:5px 12px;font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tbtn svg{width:18px;height:18px}
.popzone{position:relative;transform-style:preserve-3d;margin:4px 0 8px}
.pop{position:absolute;transform-style:preserve-3d;transform-origin:50% 100%;transform:rotateX(var(--rise));transition:transform 1.05s cubic-bezier(.28,1.65,.55,1)}
#book.folded .pop{transform:rotateX(0deg);transition:transform .32s ease-in}
.panel{position:absolute;inset:0;background:var(--paper);border-radius:8px}
.panel::after{content:"";position:absolute;left:4px;right:4px;bottom:0;height:3px;background:rgba(0,0,0,.18);border-radius:2px}
.sk{position:absolute;inset:0;pointer-events:none;overflow:visible}
.pshadow{position:absolute;background:radial-gradient(ellipse at 50% 30%,rgba(40,25,10,.35),rgba(40,25,10,0) 70%);transition:opacity .9s}
#book.folded .pshadow{opacity:0;transition:opacity .2s}
.dg{position:absolute;left:0;top:0;overflow:visible;direction:ltr}
.penlayer{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.pp{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.pdot{fill:#fff6b8;filter:url(#glow)}
.pdot.off{display:none}
.dg text{font-family:var(--fa);font-size:11px;fill:var(--muted)}
body[data-lang=en] .dg text{font-family:var(--fe)}
.org>*{fill:var(--tint);stroke:var(--pencil);stroke-width:1.5;transition:fill .25s,stroke .25s;cursor:pointer}
.org.tube>*{fill:none;stroke:#e2ae94;stroke-width:9;stroke-linecap:round}
body.dark .org.tube>*{stroke:#7a5a4c}
.org .hit{stroke:transparent!important;stroke-width:24!important;fill:none!important}
.org.hl>*{fill:var(--hl)}
.org.tube.hl>*{stroke:var(--hl)}
.org .lining{fill:#e59a7f}
.ol{fill:none;stroke:var(--pencil);stroke-width:1.3;pointer-events:none}
.info{border:2px solid var(--pencil);border-radius:12px;padding:7px 12px;background:var(--paper2);min-height:62px;font-size:14px;line-height:1.5;margin-bottom:6px}
.info b{font-size:16px}
.info .en{font-family:var(--fe);color:var(--muted);font-size:12.5px;margin-inline-start:6px}
.ctrls .row{display:flex;align-items:center;gap:9px;margin:6px 0}
.lbl{font-weight:700;white-space:nowrap;font-size:14px}
.rng{flex:1;direction:ltr;height:32px;accent-color:var(--c-zyg);touch-action:none}
output{font-family:var(--fm);font-weight:800;min-width:44px;text-align:center;color:var(--c-zyg);font-size:16px}
.btns{flex-wrap:wrap}
.btns button,.chip{min-height:40px;padding:5px 12px;border-radius:12px;border:2px solid var(--pencil);background:var(--paper);font-size:14px;font-weight:700}
.btns button.on{background:var(--pencil);color:var(--paper)}
.chip.on{background:var(--cc,var(--pencil));border-color:var(--cc,var(--pencil));color:#fff}
.cmpkey{gap:8px!important;font-size:12.5px}
.key{padding:2px 10px;border-radius:12px;border:2px solid transparent;transition:all .25s}
.key.a{color:var(--ka);border-color:var(--ka)}.key.b{color:var(--kb);border-color:var(--kb)}
.key.lit.a{background:var(--ka);color:#fff}.key.lit.b{background:var(--kb);color:#fff}
.readout{border-top:2px dashed var(--pencil);padding-top:6px;font-size:14px;line-height:1.7}
.eq{font-family:var(--fm);font-weight:800;unicode-bidi:isolate;white-space:nowrap}
.tbl{width:100%;border-collapse:collapse;font-size:12px;line-height:1.3;margin:2px 0}
.tbl td,.tbl th{border:1.5px solid var(--pencil);padding:2px 5px;text-align:center}
.tbl th{background:var(--paper2)}
.tbl .lit{background:rgba(122,75,198,.16);font-weight:700}
/* lab2 egg layers */
.disc{position:absolute;border-radius:50%;transform:translateZ(calc(var(--sep) * var(--n) * 38px));transition:transform 1.05s cubic-bezier(.28,1.6,.55,1);cursor:pointer}
#book.folded .disc{transform:translateZ(0);transition:transform .32s ease-in}
.stack.drag .disc,.stack.drag .dsh{transition:none}
.dsh{position:absolute;border-radius:50%;background:rgba(40,25,10,.2);filter:blur(calc(var(--sep) * var(--n) * 5px + 1px));transform:translate(calc(var(--sep) * var(--n) * 6px),calc(var(--sep) * var(--n) * 11px));transition:transform 1s}
#book.folded .dsh{transform:none}
.disc.zona{border:10px solid rgba(201,61,114,.28);background:rgba(255,255,255,.35);box-shadow:inset 0 0 0 1.5px var(--pencil),0 0 0 1.5px var(--pencil)}
.disc.cyto{background:radial-gradient(circle,rgba(201,61,114,.35) 1.6px,transparent 2.2px) 0 0/14px 14px,radial-gradient(circle,rgba(201,61,114,.25) 1.4px,transparent 2px) 7px 7px/14px 14px,#f7dbe3;border:2px solid var(--pencil)}
body.dark .disc.cyto{background-color:#5a3443}
.disc.nuc{background:radial-gradient(circle at 35% 35%,#9b6ad6,#5b2f99);border:2px solid var(--pencil)}
.disc.sel{box-shadow:0 0 0 4px rgba(255,214,90,.95)!important}
.dim{opacity:.35;transition:opacity .3s}
.part{cursor:pointer}
.part.sel{filter:url(#selglow)}
/* sorter */
.sorter{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:4px 0}
.card{min-height:40px;border-radius:10px;border:2px dashed var(--pencil);background:var(--paper);font-size:12.5px;font-weight:700;padding:4px 8px;line-height:1.35}
.card.yes{border-style:solid;border-color:var(--c-ox);background:rgba(210,59,47,.12)}
.card.no{border-style:solid;border-color:var(--good);background:rgba(30,138,76,.12)}
.card small{display:block;font-weight:500;font-size:12px}
/* challenge */
.stars{display:flex;gap:8px;justify-content:center}
.stars svg{width:44px;height:44px}
.star-f{fill:#f5b301;stroke:#a86f00}.star-e{fill:none;stroke:var(--pencil)}
.pips{display:flex;gap:7px;justify-content:center;margin:10px 0;direction:ltr}
.pip{width:30px;height:30px;border-radius:50%;border:2px solid var(--pencil);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;font-family:var(--fe)}
.pip.ok{background:var(--good);border-color:var(--good);color:#fff}.pip.no{background:rgba(217,130,43,.25);border-color:var(--soft)}
.pip.cur{box-shadow:0 0 0 3px rgba(122,75,198,.35)}
.round{border:2px solid var(--pencil);border-radius:14px;padding:12px 14px;background:var(--paper2)}
.rq{font-size:16px;font-weight:700;line-height:1.55;margin-bottom:10px}
.ropts{display:flex;flex-direction:column;gap:8px}
.ropts .opt{text-align:start;font-size:15px;min-height:46px}
.countbtns{display:flex;gap:9px;justify-content:center;direction:ltr;flex-wrap:wrap}
.countbtns .opt{min-width:62px;font:800 18px var(--fe)}
.srow{display:flex;align-items:center;gap:6px;margin:5px 0;font-size:14px}
.srow span{flex:1}
.srow .opt{min-height:36px;font-size:13px;padding:3px 9px}
.rfb{margin-top:10px;min-height:28px;font-size:14.5px;line-height:1.55}
.rfb.okk{color:var(--good)}
.nextbtn{margin-top:8px;min-height:44px;padding:8px 20px;border-radius:12px;border:none;background:var(--c-zyg);color:#fff;font-weight:800;font-size:15px}
.trophy{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800}
/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:5;min-height:var(--navH);display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;padding:8px 10px;
  background:var(--ui);color:var(--uiInk);box-shadow:0 -4px 18px rgba(40,25,10,.25);backdrop-filter:blur(6px)}
.grp{display:flex;align-items:center;gap:7px}
.nb{min-width:44px;height:44px;border-radius:12px;border:2px solid currentColor;background:transparent;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-weight:800}
.nb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nb.on{background:var(--uiInk);color:var(--paper)}
.nb:disabled{opacity:.35}
[dir=rtl] .flipx{transform:scaleX(-1)}
#dots{display:flex;gap:6px}
.dot{width:32px;height:32px;border-radius:50%;border:2px solid currentColor;background:transparent;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;font-family:var(--fe)}
.dot.cur{background:var(--c-zyg);border-color:var(--c-zyg);color:#fff}
.dot.done{box-shadow:0 0 0 3px var(--good)}
#fx{position:fixed;inset:0;z-index:9;pointer-events:none}
#coverFront{position:absolute;top:-14px;left:-8px;width:496px;height:calc(var(--ph,860px) + 30px);transform-style:preserve-3d;transform:translateZ(3px);display:none;cursor:pointer}
#coverFront.show{display:block}
#coverFront .cf,#coverFront .cb{position:absolute;inset:0;border-radius:6px 14px 14px 6px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
[dir=rtl] #coverFront .cf,[dir=rtl] #coverFront .cb{border-radius:14px 6px 6px 14px}
#coverFront .cf{background:radial-gradient(120% 70% at 30% 15%,#3a7d5c,#1f4a37 60%,#173827);box-shadow:inset 0 0 0 3px rgba(0,0,0,.25),inset 0 0 60px rgba(0,0,0,.35),0 20px 40px rgba(20,10,0,.45);color:#f3dfa2;text-align:center;overflow:hidden}
#coverFront .cb{transform:rotateY(180deg);background:repeating-radial-gradient(circle at 30% 40%,#e9dcc0 0 6px,#efe4cb 6px 14px),#efe4cb;box-shadow:inset 0 0 30px rgba(0,0,0,.2)}
.cvSpine{position:absolute;top:0;bottom:0;width:30px;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.06),rgba(0,0,0,.3));}
[dir=rtl] .cvSpine{right:0}[dir=ltr] .cvSpine{left:0}
.cvFrame{position:absolute;inset:26px 40px;border:2px solid rgba(243,223,162,.75);border-radius:10px;box-shadow:0 0 0 6px rgba(0,0,0,.08),inset 0 0 0 5px rgba(243,223,162,.0),inset 0 0 0 6px rgba(243,223,162,.45)}
.gold{background:linear-gradient(180deg,#fff2c4,#e7c66a 45%,#b58a2b 55%,#f0d58a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 1px 0 rgba(0,0,0,.0)}
.cvIn{position:absolute;inset:52px 64px;display:flex;flex-direction:column;align-items:center;gap:10px}
.cvTag{border:1.5px solid #e7c66a;border-radius:20px;padding:4px 16px;font-size:15px;font-weight:700;letter-spacing:.5px;color:#f3dfa2}
.cvSubj{font-size:64px;font-weight:900;line-height:1.1;margin-top:6px}
.cvUnit{font-size:20px;font-weight:700;color:#f3dfa2;opacity:.9}
.cvTitle{font-size:34px;font-weight:900;line-height:1.25}
.cvMeta{font-size:15px;color:#e9d9a8;opacity:.9}
.cvRule{width:60%;height:2px;background:linear-gradient(90deg,transparent,#e7c66a,transparent);margin:4px 0}
.cvBy{margin-top:auto;display:flex;flex-direction:column;gap:2px;align-items:center}
.cvBy small{font-size:14px;color:#e9d9a8}
.cvBy b{font-size:26px;font-weight:900}
.cvOpen{margin-top:12px;border:2px solid #e7c66a;background:rgba(0,0,0,.18);color:#f3dfa2;border-radius:24px;padding:9px 26px;font-size:17px;font-weight:800}
.cvOpen:hover{background:rgba(231,198,106,.2)}
body.teacher .page{width:960px}
body.teacher .pin.lab{display:grid;grid-template-columns:420px 1fr;column-gap:30px;align-content:start;padding:28px 38px}
body.teacher .pin.lab>.labhead,body.teacher .pin.lab>.hint{grid-column:1/-1}
body.teacher .pin.lab>.popzone{grid-column:1;grid-row:3/span 6;margin-top:24px}

const A={ctx:null,master:null,osc:null,vg:null,timer:0,listen:false,listenIv:0};
function audioInit(){ if(A.ctx){ if(A.ctx.state==='suspended') A.ctx.resume(); return; }
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  A.ctx=new AC(); A.master=A.ctx.createGain(); A.master.gain.value=state.muted?0:.5;
  const comp=A.ctx.createDynamicsCompressor(); A.master.connect(comp); comp.connect(A.ctx.destination); }
function voice(freq){ if(!A.ctx) return; const now=A.ctx.currentTime;
  if(!A.osc){ A.osc=A.ctx.createOscillator(); A.osc.type='triangle'; A.vg=A.ctx.createGain(); A.vg.gain.value=0;
    const lp=A.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1800; A.osc.connect(lp); lp.connect(A.vg); A.vg.connect(A.master); A.osc.frequency.value=freq; A.osc.start(); }
  A.osc.frequency.setTargetAtTime(freq,now,.035); A.vg.gain.setTargetAtTime(.1,now,.04);
  clearTimeout(A.timer); if(!A.listen) A.timer=setTimeout(voiceOff,1500); }
function voiceOff(){ if(A.vg&&A.ctx) A.vg.gain.setTargetAtTime(0,A.ctx.currentTime,.09); }
function blip(f,d=.14,type='sine',v=.15,at=0){ if(!A.ctx) return; const t0=A.ctx.currentTime+at; const o=A.ctx.createOscillator(), g=A.ctx.createGain();
  o.type=type; o.frequency.value=f; g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(v,t0+.012); g.gain.exponentialRampToValueAtTime(.0005,t0+d);
  o.connect(g); g.connect(A.master); o.start(t0); o.stop(t0+d+.05); }
function chord(fs,d=.5,v=.08){ fs.forEach((f,i)=>blip(f,d,'triangle',v,i*.05)); }
function noise(d=.45,f0=700,f1=2600,v=.12){ if(!A.ctx) return; const n=A.ctx.sampleRate*d, b=A.ctx.createBuffer(1,n,A.ctx.sampleRate), dd=b.getChannelData(0);
  for(let i=0;i<n;i++) dd[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.5);
  const s=A.ctx.createBufferSource(); s.buffer=b; const bp=A.ctx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=.8;
  const t0=A.ctx.currentTime; bp.frequency.setValueAtTime(f0,t0); bp.frequency.exponentialRampToValueAtTime(f1,t0+d*.9);
  const g=A.ctx.createGain(); g.gain.value=v; s.connect(bp); bp.connect(g); g.connect(A.master); s.start(); }
const flipSound=()=>noise();

/* ============ pens & animation loop ============ */
let PENS=[], ANIMS=[];
function setPen(svg,segs){ if(!svg) return;
  svg.innerHTML=segs.map(s=>`<path class="pp" d="${s.d}" stroke="${s.c}" ${s.w?`stroke-width="${s.w}"`:''}/>`).join('')+'<circle class="pdot off" r="5.5" cx="0" cy="0"/>';
  const paths=$$('path',svg), lens=paths.map(p=>{try{return p.getTotalLength()}catch(e){return 0}});
  paths.forEach((p,i)=>{p.style.strokeDasharray=lens[i]+' '+lens[i]; p.style.strokeDashoffset=lens[i];});
  PENS=PENS.filter(p=>p.svg!==svg&&p.svg.isConnected);
  PENS.push({svg,paths,lens,dot:$('circle',svg),t0:performance.now(),total:lens.reduce((a,b)=>a+b,0)}); }
function addAnim(root,fn){ if(root._anim) { root._anim.fn=fn; return; } const a={root,fn}; root._anim=a; ANIMS.push(a); }
let lastNow=performance.now();
function frame(now){
  const dt=Math.min(60,now-lastNow); lastNow=now;
  PENS=PENS.filter(p=>p.svg.isConnected);
  for(const p of PENS){ if(!p.total) continue;
    const dur=Math.max(700,p.total/0.42), cyc=dur+1500, tt=state.motion?(now-p.t0)%cyc:cyc;
    let drawn=Math.min(1,tt/dur)*p.total, acc=0, pt=null;
    p.paths.forEach((path,i)=>{ const L=p.lens[i], here=Math.max(0,Math.min(L,drawn-acc)); path.style.strokeDashoffset=L-here; if(here>0&&here<L&&!pt) pt=path.getPointAtLength(here); acc+=L; });
    if(pt&&tt<dur){p.dot.setAttribute('cx',pt.x);p.dot.setAttribute('cy',pt.y);p.dot.classList.remove('off');} else p.dot.classList.add('off'); }
  ANIMS=ANIMS.filter(a=>a.root.isConnected&&!a.root.closest('#offscreen'));
  for(const a of ANIMS){ try{ a.fn(now,state.motion?dt:0); }catch(e){ console.error(e); } }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

    const root=document.createElement('div'); root.className='sheet'; root.style.left=hinge+'px'; layer.appendChild(root);
    const strips=[], shades=[]; let parent=root;
    const mkFace=(cls,src,x)=>{ const f=document.createElement('div'); f.className='face '+cls; const inner=document.createElement('div'); inner.className='faceIn';
      inner.style.left=(-x)+'px'; inner.style.width=W+'px'; inner.style.height=H+'px'; if(src) inner.appendChild(src.cloneNode(true)); f.appendChild(inner);
      const sh=document.createElement('div'); sh.className='fshade'; f.appendChild(sh); shades.push(sh); return f; };
    for(let i=0;i<NS;i++){ const st=document.createElement('div'); st.className='strip'; st.style.width=w+'px';
      if(s>0){ st.style.left=(i?w:0)+'px'; st.style.transformOrigin='0 50%'; } else { st.style.left=(-w)+'px'; st.style.transformOrigin='100% 50%'; }
      const fx=s>0?i*w:W-(i+1)*w, bx=s>0?W-(i+1)*w:i*w; st.appendChild(mkFace('front',front,fx)); st.appendChild(mkFace('back',back,bx)); parent.appendChild(st); strips.push(st); parent=st; }
    flipSound(); const t0=performance.now();
    const fr=now=>{ const p=Math.min(1,(now-t0)/dur); let e=ease(p); if(reverse) e=1-e; const total=180*e, curl=34*Math.sin(Math.PI*e); let cum=0;
      strips.forEach((st,i)=>{ const a=i===0?Math.max(0,total-curl*.5):curl*(i/(NS-1))*2/NS; cum+=a; st.style.transform=`rotateY(${-s*a}deg)`;
        const sh=Math.abs(Math.sin(cum*Math.PI/180))*.42; shades[i*2].style.opacity=sh; shades[i*2+1].style.opacity=sh*.8; });
      cast.style.opacity=Math.sin(Math.PI*e)*.9; if(p<1) requestAnimationFrame(fr); else { layer.innerHTML=''; res(); } };
    requestAnimationFrame(fr); }); }
async function go(delta){ if(busy) return;
  if(mode==='cover'){ if(delta>0) openBook(); return; }
  if(delta<0&&((mode==='single'&&state.spage===0)||(mode==='spread'&&state.spread===0))) return closeBook();
  if(mode==='single'){ const tg=state.spage+delta; if(tg<0||tg>=NCH*2) return; } else { const tg=state.spread+delta; if(tg<0||tg>=NCH) return; }
  busy=true; stopSounds(); stopCompare(); const book=$('#book');
  const apply=()=>{ if(mode==='single'){ state.spage+=delta; state.spread=Math.floor(state.spage/2);} else { state.spread+=delta; state.spage=state.spread*2; } };
  if(!state.motion){ apply(); mount(); busy=false; return; }
  book.classList.add('folded'); await sleep(330); const fwd=delta>0, rtl=isRTL();
  if(mode==='spread'){ const s=(fwd!==rtl)?1:-1, k0=kinds(), sideSlot=s>0?$('#pB'):$('#pA'), otherSlot=s>0?$('#pA'):$('#pB'), front=cloneOf(sideSlot);
    apply(); const off=$('#offscreen'); off.innerHTML=pageHTML(state.spread,s>0?k0.L:k0.R); runUpdate(off); await sleep(30); const back=cloneOf(off);
    sideSlot.innerHTML=pageHTML(state.spread,s>0?k0.R:k0.L)+'<div class="gut"></div>'; runUpdate(sideSlot);
    await flipAnim({hinge:480,s,front,back}); otherSlot.innerHTML=pageHTML(state.spread,s>0?k0.L:k0.R)+'<div class="gut"></div>'; runUpdate(otherSlot); off.innerHTML=''; }
  else { const W=mode==='teacher'?960:480, H=mode==='teacher'?640:860, s=rtl?-1:1, hinge=rtl?W:0, slot=$('#pA');
    if(fwd){ const front=cloneOf(slot); apply(); const d=curSingle(); slot.innerHTML=pageHTML(d.ci,d.kind)+'<div class="gut"></div>'; runUpdate(slot); await flipAnim({hinge,s,front,back:null,W,H}); }
    else { apply(); const d=curSingle(), off=$('#offscreen'); off.innerHTML=pageHTML(d.ci,d.kind); runUpdate(off); await sleep(30); const front=cloneOf(off);
      await flipAnim({hinge,s,front,back:null,reverse:true,W,H}); slot.innerHTML=pageHTML(d.ci,d.kind)+'<div class="gut"></div>'; runUpdate(slot); off.innerHTML=''; } }
  renderNav(); await sleep(40); book.classList.remove('folded'); busy=false; }
function jumpTo(ci){ if(busy) return; if(mode==='cover'){ state.spread=ci; state.spage=ci*2; return openBook(); } const cur=mode==='single'?Math.floor(state.spage/2):state.spread;
  if(mode==='single'){ const tg=ci*2, d=tg-state.spage; if(d===0) return; if(Math.abs(d)===1) return go(d); state.spage=tg; state.spread=ci; stopSounds(); mount(); unfoldSoon(); return; }
  if(ci===cur) return; if(Math.abs(ci-cur)===1) return go(ci-cur); state.spread=ci; state.spage=ci*2; stopSounds(); stopCompare(); mount(); unfoldSoon(); }

/* ============ cover ============ */
const CV={ar:{tag:'كتاب تفاعلي',subj:'الأحياء',unit:'الوحدة الرابعة',title:'التكاثر في الإنسان',meta:'الصف العاشر · الفصل الدراسي الأول · سلطنة عُمان',by:'إعداد',role:'معلمة تقنية المعلومات',name:'ابتسام الرواس',open:'افتح الكتاب'},
 en:{tag:'Interactive Book',subj:'Biology',unit:'Unit 4',title:'Reproduction in Humans',meta:'Grade 10 · Semester 1 · Sultanate of Oman',by:'Prepared by',role:'IT Teacher',name:'Ibtisam Al Rawas',open:'Open the book'}};
function coverHTML(){ const X=CV[state.lang];
  return `<div class="cf" data-act="open"><div class="cvSpine"></div><div class="cvFrame"></div><div class="cvIn">
   <div class="cvTag">${X.tag}</div>
   <div class="cvSubj gold">${X.subj}</div>
   <div class="cvRule"></div>
   <div class="cvUnit">${X.unit}</div>
   <div class="cvTitle gold">${X.title}</div>
   <svg width="230" height="190" viewBox="0 0 230 190" fill="none" stroke="#e7c66a" stroke-width="2" stroke-linecap="round">
     <circle cx="98" cy="96" r="62" stroke-width="2.5"/><circle cx="98" cy="96" r="52" stroke-dasharray="3 5" opacity=".8"/>
     <circle cx="98" cy="96" r="17" fill="rgba(231,198,106,.25)"/><path d="M90 92 q4 -6 8 0 q4 6 8 0" opacity=".9"/>
     ${[[70,70],[122,72],[72,124],[126,118],[60,98],[136,96],[98,64],[98,132]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2" fill="#e7c66a" stroke="none" opacity=".7"/>`).join('')}
     <g transform="translate(176 46) rotate(140)"><ellipse rx="9" ry="6" fill="rgba(231,198,106,.35)"/><path d="M9 0 q10 -8 20 0 t20 0 t20 0" stroke-width="2.2"/></g>
     <g transform="translate(190 120) rotate(175)" opacity=".7"><ellipse rx="7" ry="4.6"/><path d="M7 0 q8 -6 16 0 t16 0" /></g>
     <g transform="translate(30 168) rotate(-40)" opacity=".55"><ellipse rx="6" ry="4"/><path d="M6 0 q7 -5 14 0 t14 0"/></g>
   </svg>
   <div class="cvMeta">${X.meta}</div>
   <div class="cvBy"><small>${X.by}</small><span class="cvMeta" style="font-weight:700">${X.role}</span><b class="gold">${X.name}</b>
     <button class="cvOpen" data-act="open">${X.open} ${isRTL()?'←':'→'}</button></div>
  </div></div><div class="cb"></div>`; }
async function openBook(){ if(busy) return; busy=true; stopSounds(); const cv=$('#coverFront');
  if(state.motion){ noise(.6,500,2200,.12); cv.style.transformOrigin=isRTL()?'100% 50%':'0% 50%'; cv.style.transition='transform 1.15s cubic-bezier(.55,0,.25,1)';
    void cv.offsetWidth; cv.style.transform=`translateZ(3px) rotateY(${isRTL()?168:-168}deg)`; await sleep(1150); }
  state.cover=false; layout(); mount(); unfoldSoon(); busy=false; }
async function closeBook(){ if(busy) return; busy=true; stopSounds(); stopCompare(); state.cover=true; state.spread=0; state.spage=0; layout(); mount();
  const cv=$('#coverFront');
  if(state.motion){ cv.style.transformOrigin=isRTL()?'100% 50%':'0% 50%'; cv.style.transform=`translateZ(3px) rotateY(${isRTL()?168:-168}deg)`; void cv.offsetWidth;
    cv.style.transition='transform 1.05s cubic-bezier(.55,0,.25,1)'; noise(.5,2200,500,.1); cv.style.transform='translateZ(3px)'; await sleep(1050); }
  busy=false; }

/* ============ nav ============ */
function renderNav(){ const ci=mode==='single'?Math.floor(state.spage/2):state.spread;
  const atStart=mode==='cover'||mode==='teacher'&&state.spread===0, atEnd=mode==='single'?state.spage===NCH*2-1:state.spread===NCH-1;
  const done=i=>i===6?state.ch.done:!!state.checks[i];
  $('#nav').innerHTML=`<div class="grp"><button class="nb" data-act="prev" aria-label="${t('prev')}" ${atStart?'disabled':''}>${ICON.chev}</button>
    <div id="dots">${Array.from({length:NCH},(_,i)=>`<button class="dot ${i===ci&&mode!=='cover'?'cur':''} ${done(i)?'done':''}" data-act="dot" data-i="${i}" aria-label="${t('ch')} ${i+1}">${done(i)?'✓':i+1}</button>`).join('')}</div>
    <button class="nb" data-act="next" aria-label="${t('next')}" ${atEnd?'disabled':''}>${ICON.chevN}</button></div>
    <div class="grp"><button class="nb" data-act="lang" aria-label="language">${t('lang')}</button>
    <button class="nb" data-act="dark" aria-label="${t('dark')}">${state.dark?ICON.sun:ICON.moon}</button>
    <button class="nb ${state.muted?'on':''}" data-act="mute" aria-label="${t('muteL')}">${state.muted?ICON.mute:ICON.snd}</button>
    <button class="nb ${state.motion?'':'on'}" data-act="motion" aria-label="${t('motionL')}">${state.motion?ICON.pause:ICON.play}</button>
    <button class="nb ${state.teacher?'on':''}" data-act="teacher" aria-label="${t('teacherShort')}">${ICON.board}</button></div>`; }

/* ============ compare / listen ============ */
let cmpIv=0, cmpRoot=null;
function stopCompare(){ clearInterval(cmpIv); cmpIv=0; if(cmpRoot&&cmpRoot.dataset.lab==='3'){ LAB4.stopCmp(); if(cmpRoot.isConnected) LAB4.update(cmpRoot); } cmpRoot=null; $$('.cmp').forEach(b=>b.classList.remove('on')); }
function startCompare(root){ const L=LABS[+root.dataset.lab]; cmpRoot=root; const tick=()=>{ if(!root.isConnected){ stopCompare(); return; } L.cmp(root); };
  tick(); cmpIv=setInterval(tick,1700); $('.cmp',root).classList.add('on'); }

/* ============ events ============ */
function confetti(x,y,n=40){ if(!state.motion) return; const cv=$('#fx'), cx=cv.getContext('2d'); cv.width=innerWidth; cv.height=innerHeight;
  const cols=['#c93d72','#0f8796','#7a4bc6','#2e9a57','#f5b301'];
  const ps=Array.from({length:n},()=>({x,y,vx:(Math.random()-.5)*9,vy:-Math.random()*9-3,r:Math.random()*4+3,c:cols[Math.random()*5|0],a:Math.random()*6}));
  let f=0; const step=()=>{ cx.clearRect(0,0,cv.width,cv.height); ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.a+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore();});
    if(++f<70) requestAnimationFrame(step); else cx.clearRect(0,0,cv.width,cv.height); }; step(); }
const ctr=el=>{const r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2];};
function answer(pick,btn,ok){ const c=state.ch, q=RQ[state.lang][c.i]; if(c.ans[c.i]) return; ok=ok!==undefined?ok:pick===q.a; c.ans[c.i]={pick,ok};
  const [x,y]=ctr(btn); refreshKeep(); if(ok){ chord([523,659,784],.4,.09); confetti(x,y,36); } else blip(300,.18,'sine',.08); }
document.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b||b.disabled) return; const act=b.dataset.act, root=b.closest('.pin');
  switch(act){
   case 'prev': return go(-1);
   case 'next': return go(1);
   case 'dot': return jumpTo(+b.dataset.i);
   case 'lang': stopSounds(); stopCompare(); state.lang=isRTL()?'en':'ar'; layout(); mount(); return;
   case 'dark': state.dark=!state.dark; layout(); renderNav(); return;
   case 'mute': state.muted=!state.muted; if(A.master) A.master.gain.value=state.muted?0:.5; renderNav(); return;
   case 'motion': state.motion=!state.motion; layout(); renderNav(); return;
   case 'teacher': return toggleTeacher();
   case 'open': return openBook();
   case 'flap': { const ci=+b.dataset.ci; state.flaps[ci]=!state.flaps[ci]; b.classList.toggle('open',state.flaps[ci]); blip(state.flaps[ci]?520:390,.12,'triangle',.1); return; }
   case 'check': { const ci=+b.dataset.ci, i=+b.dataset.i, L=TX[state.lang][ci]; state.checkPick[ci]=i; const box=b.closest('.check');
     $$('.opt',box).forEach((o,j)=>o.className='opt '+(j===i?(i===L.ca?'right':'wrong'):''));
     if(i===L.ca){ state.checks[ci]=true; $('.cfb',box).innerHTML='<span class="ok">'+L.ok+'</span>'; chord([523,659,784],.4,.08); confetti(...ctr(b),30); renderNav(); }
     else { $('.cfb',box).textContent=t('retry'); blip(330,.15,'sine',.08); } return; }
   case 'cmp': if(cmpIv&&cmpRoot===root) stopCompare(); else { stopCompare(); startCompare(root); } return;
   case 'listen': { const L=LABS[+root.dataset.lab]; if(A.listen){ const on=false; stopSounds(); L.listenToggle&&L.listenToggle(root,false); }
     else { A.listen=true; b.classList.add('on'); if(L.listenToggle) L.listenToggle(root,true); else { L.listen(root); A.listenIv=setInterval(()=>{ if(!root.isConnected){stopSounds();return;} L.listen(root); },900); } } return; }
   case 'rq': return answer(+b.dataset.i,b);
   case 'rqorg': return answer(b.dataset.org,b,b.dataset.org===RQ[state.lang][state.ch.i].a);
   case 'rqcheck': return answer(state.ch.lvl,b);
   case 'rqsort': { state.ch.sort[+b.dataset.k]=+b.dataset.v; refreshKeep(); blip(500,.06); return; }
   case 'rqsortcheck': { const q=RQ[state.lang][state.ch.i], ok=q.items.every((it,k)=>state.ch.sort[k]===it[1]); return answer(JSON.stringify(state.ch.sort),b,ok); }
   case 'rqnext': { const n=RQ[state.lang].length; state.ch.sort={}; if(state.ch.i>=n-1){ state.ch.done=true; refreshKeep(); if(starsOf(correctCount())){ confetti(innerWidth/2,innerHeight/2,90); chord([523,659,784,1047],.8,.08);} }
     else { state.ch.i++; refreshKeep(); } blip(600,.08); return; }
   case 'rqreset': state.ch={i:0,ans:[],lvl:2,done:false,sort:{}}; refreshKeep(); return;
  }
  if(root&&root.dataset.lab!==undefined&&root.dataset.lab!=='c'){ LABS[+root.dataset.lab].act(act,b,root); }
});
document.addEventListener('input',e=>{ const el=e.target, k=el.dataset&&el.dataset.in; if(!k) return; const root=el.closest('.pin');
  if(k==='rqlvl'){ state.ch.lvl=+el.value; const sv=$('.round svg g',root); if(sv) sv.innerHTML=cluster(2**state.ch.lvl,150,55,'var(--c-zyg)'); $('output',root).innerHTML=N(state.ch.lvl);
    const eq=$$('.round .eq',root).pop(); if(eq) eq.innerHTML=`2<sup>${state.ch.lvl}</sup> = ${2**state.ch.lvl}`; voice(196*Math.pow(2,state.ch.lvl/3)); return; }
  if(root&&root.dataset.lab!==undefined){ if(cmpRoot===root) stopCompare(); LABS[+root.dataset.lab].input(k,el,root); } });
function unfoldSoon(){ const b=$('#book'); b.classList.add('folded'); setTimeout(()=>b.classList.remove('folded'),state.motion?380:0); }
function toggleTeacher(){ if(busy) return; state.cover=false; stopSounds(); stopCompare(); state.teacher=!state.teacher; if(!state.teacher) state.spage=state.spread*2+1; layout(); mount(); unfoldSoon(); }
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT'&&e.target.type==='range') return;
  if(e.key==='Escape'&&state.teacher){ toggleTeacher(); return; }
  if(e.key==='ArrowLeft') go(isRTL()?1:-1); if(e.key==='ArrowRight') go(isRTL()?-1:1); });
let sw=null;
$('#viewport').addEventListener('pointerdown',e=>{ if(e.target.closest('input,button,.disc,.org,.part,.noswipe,.flap')){sw=null;return;} sw={x:e.clientX,y:e.clientY}; });
$('#viewport').addEventListener('pointerup',e=>{ if(!sw) return; const dx=e.clientX-sw.x, dy=e.clientY-sw.y; sw=null; if(Math.abs(dx)>60&&Math.abs(dy)<70){ const nx=isRTL()?dx>0:dx<0; go(nx?1:-1); } });
addEventListener('resize',()=>{ if(layout()){ mount(); unfoldSoon(); } });

renderNav(); layout(); mount(); unfoldSoon();
window.__book={state,go,mount,layout,toggleTeacher,get mode(){return mode}};
